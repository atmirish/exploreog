:root{
  --ink:#16324f; --ink-soft:#4a6380; --mist:#e4f2ee; --paper:#fffdf7; --gold:#ffc933;
  --green:#2fa66a; --orange:#f2a541; --purple:#8e6bd8; --red:#e5604e; --blue:#1f7fb8; --sky:#bfe7f6;
  --good:#2fa66a; --bad:#e5604e;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --body:'Fredoka Variable','Fredoka','Trebuchet MS',system-ui,sans-serif;
  --line:3px solid var(--ink); --ledge:0 5px 0 var(--ink);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--body);color:var(--ink);background:var(--mist);-webkit-tap-highlight-color:transparent;user-select:none;font-size:17px}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;letter-spacing:.3px;text-wrap:balance}
.app{max-width:1200px;margin:0 auto;padding:16px 18px 32px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* header */
header.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:26px}
.brand .dot{width:44px;height:44px;border-radius:50%;background:var(--orange);border:var(--line);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center}
.spacer{flex:1}
.pill{background:var(--paper);border:var(--line);border-radius:999px;padding:7px 15px;font-weight:600;box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;gap:7px;font-size:16px}
button.pill:active{transform:translateY(3px);box-shadow:none}

/* buttons */
.btn{background:var(--paper);border:var(--line);border-radius:16px;padding:11px 20px;font-family:var(--display);font-size:20px;box-shadow:var(--ledge);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 0 var(--ink)}
.btn:active{transform:translateY(5px);box-shadow:none}
.btn.primary{background:var(--gold)}
.btn.small{padding:7px 14px;font-size:16px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.btn.on{background:var(--ink);color:#fff}

/* home */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;margin:4px 0 26px}
.hero h1{font-size:clamp(46px,7vw,84px);line-height:.92;margin:0 0 14px;text-shadow:4px 4px 0 var(--gold)}
.hero p{font-size:20px;line-height:1.4;color:var(--ink-soft);margin:0 0 18px;max-width:34ch}
.lvlrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.age{display:inline-flex;background:var(--paper);border:var(--line);border-radius:999px;padding:4px;box-shadow:0 4px 0 var(--ink)}
.age button{border-radius:999px;padding:9px 18px;font-size:17px;font-weight:600;color:var(--ink-soft)}
.age button small{font-weight:500}
.age button.on{background:var(--ink);color:#fff}
.helpbtn{width:40px;height:40px;border-radius:50%;background:var(--gold);border:var(--line);font-family:var(--display);font-size:22px;box-shadow:0 3px 0 var(--ink)}
.age-note{font-size:15px;color:var(--ink-soft);margin-top:10px}
.board{border:var(--line);border-radius:26px;box-shadow:0 6px 0 var(--ink);background:#9c6435;overflow:hidden;transform:rotate(1deg)}
.board svg{display:block;width:100%;height:auto}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.mode{background:var(--paper);border:var(--line);border-radius:22px;box-shadow:0 6px 0 var(--ink);text-align:left;display:flex;flex-direction:column;overflow:hidden;transition:transform .12s,box-shadow .12s}
.mode:hover{transform:translateY(-3px);box-shadow:0 9px 0 var(--ink)}
.mode:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.mode .art{height:120px;display:grid;place-items:center;border-bottom:var(--line);position:relative;background:var(--tint)}
.mode .art svg{width:88px;height:88px;filter:drop-shadow(0 3px 0 rgba(22,50,79,.18))}
.mode .body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:4px}
.mode h3{margin:0;font-size:23px}
.mode p{margin:0;color:var(--ink-soft);font-size:15.5px;line-height:1.3}
.mode .tag{position:absolute;top:10px;right:10px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--paper);border:2px solid var(--ink)}
.m1{--tint:#fde9c6}.m2{--tint:#fbd9d3}.m3{--tint:#d6ebf8}.m4{--tint:#e6dcfb}.m5{--tint:#d5ece2}.m6{--tint:#f6e7c8}.m7{--tint:#dff2d0}.m8{--tint:#cfe8f5}.m9{--tint:#f3dff0}.m10{--tint:#e2e6fb}.m11{--tint:#d4f0df}.m12{--tint:#dcefe0}.m13{--tint:#fde2e8}.m14{--tint:#fbe3d6}.m15{--tint:#fff1c4}.m16{--tint:#e3f0fb}

/* game layout */
.play{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start}
.stage{background:var(--paper);border:var(--line);border-radius:28px;box-shadow:0 6px 0 var(--ink);padding:22px;min-height:520px;display:flex;flex-direction:column;align-items:center;gap:18px}
.panel{display:flex;flex-direction:column;gap:14px}
.card{background:var(--paper);border:var(--line);border-radius:20px;padding:16px 18px;box-shadow:var(--ledge)}
.card h3{margin:0 0 4px;font-size:24px}
.card p{margin:0;color:var(--ink-soft);font-size:16px;line-height:1.35}
.modeswitch{display:flex;background:var(--paper);border:var(--line);border-radius:999px;padding:4px;box-shadow:0 4px 0 var(--ink)}
.modeswitch button{flex:1;border-radius:999px;padding:9px 10px;font-family:var(--display);font-size:19px;color:var(--ink-soft)}
.modeswitch button.on{background:var(--ink);color:#fff}
.bubble{background:var(--paper);border:var(--line);border-radius:18px;padding:12px 16px;font-size:17px;font-weight:500;box-shadow:0 3px 0 var(--ink);line-height:1.35;min-height:52px}
.progress{display:flex;gap:6px;flex-wrap:wrap}
.progress i{width:16px;height:16px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);display:block;transition:transform .2s}
.progress i.ok{background:var(--good)}.progress i.no{background:var(--bad)}.progress i.now{background:var(--gold);transform:scale(1.25)}
.statline{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-weight:600;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.q{font-family:var(--display);font-size:clamp(34px,5vw,54px);line-height:1;text-align:center;margin:4px 0}
.qsub{font-size:19px;color:var(--ink-soft);text-align:center;font-weight:500;margin:-6px 0 0}
.opts{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.opt{min-width:110px;background:#fff;border:var(--line);border-radius:18px;padding:14px 20px;font-family:var(--display);font-size:32px;box-shadow:var(--ledge);transition:transform .08s,box-shadow .08s}
.opt:hover{transform:translateY(-1px);box-shadow:0 6px 0 var(--ink)}
.opt:active{transform:translateY(5px);box-shadow:none}
.opt.wide{font-size:22px;min-width:220px}
.opt.good{background:var(--good);color:#fff}.opt.bad{background:var(--bad);color:#fff}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}

/* ten frames + arrays */
.frames{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.frame{display:grid;grid-template-columns:repeat(5,52px);gap:6px;background:#fff;border:var(--line);border-radius:14px;padding:8px;box-shadow:0 4px 0 var(--ink)}
.frame .cell{width:52px;height:52px;border-radius:10px;background:#eef4f7;border:2px dashed #b9c9d6;display:grid;place-items:center}
.frame .cell i{width:38px;height:38px;border-radius:50%;display:block;border:2.5px solid var(--ink)}
.frame .cell i.r{background:var(--red)}.frame .cell i.b{background:var(--blue)}.frame .cell i.x{background:#cfd8df;position:relative}
.frame .cell i.x:after{content:"";position:absolute;left:-4px;right:-4px;top:16px;height:3px;background:var(--ink);transform:rotate(-40deg)}
.frame.tap .cell{cursor:pointer}
.sentence{font-family:var(--display);font-size:clamp(34px,5vw,52px);text-align:center}
.sentence .r{color:var(--red)}.sentence .b{color:var(--blue)}
.array{display:grid;gap:5px;justify-content:center}
.array i{width:22px;height:22px;border-radius:50%;background:var(--orange);border:2px solid var(--ink);display:block}
.array i.row-alt{background:var(--purple)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:560px}
.facts button{background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:7px 4px;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.facts button.on{background:var(--gold)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
.keypad button{height:58px;background:#fff;border:var(--line);border-radius:14px;font-family:var(--display);font-size:28px;box-shadow:0 4px 0 var(--ink)}
.keypad button:active{transform:translateY(4px);box-shadow:none}
.keypad .ok{background:var(--gold)}
.answer{min-width:160px;min-height:70px;border:var(--line);border-radius:16px;background:#fff;font-family:var(--display);font-size:48px;display:grid;place-items:center;padding:0 16px}
.answer.good{background:var(--good);color:#fff}.answer.bad{background:var(--bad);color:#fff}

/* pizza + fractions */
.pizza{width:min(340px,80vw);height:auto;touch-action:manipulation}
.pizza .slice{cursor:pointer}
.slicecount{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.frac{display:inline-flex;flex-direction:column;align-items:center;font-family:var(--display);line-height:1;vertical-align:middle}
.frac b{font-weight:400;padding:0 6px}
.frac b:first-child{border-bottom:4px solid currentColor;padding-bottom:4px}
.frac b:last-child{padding-top:4px}
.fracbig{font-size:64px}
.fracrow{display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:center}
.fracinfo{font-size:20px;font-weight:600;line-height:1.5;text-align:left}
.fracinfo span{color:var(--ink-soft);font-weight:500}
.opt .frac{font-size:30px}

/* clock */
.clock{width:min(340px,80vw);height:auto;touch-action:none}
.clock .hand{cursor:grab}
.timebox{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:stretch}
.tbox{background:#fff;border:var(--line);border-radius:16px;padding:10px 18px;text-align:center;box-shadow:0 4px 0 var(--ink);min-width:150px}
.tbox small{display:block;font-size:14px;color:var(--ink-soft);font-weight:600}
.tbox b{display:block;font-family:var(--display);font-weight:400;font-size:34px;font-variant-numeric:tabular-nums}
.tbox.words b{font-size:24px}
.ampm{display:inline-flex;background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:3px;margin-top:6px}
.ampm button{border-radius:999px;padding:4px 12px;font-weight:600;font-size:14px}
.ampm button.on{background:var(--ink);color:#fff}
.nudge{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ticket{background:#fff;border:var(--line);border-radius:16px;padding:14px 18px;box-shadow:0 4px 0 var(--ink);max-width:520px;font-size:20px;line-height:1.4;text-align:center}
.ticket b{font-family:var(--display);font-weight:400;font-size:26px}


.exbar{display:flex;align-items:center;gap:10px;width:100%;justify-content:space-between;background:#fff6d6;border:var(--line);border-radius:16px;padding:8px 10px;box-shadow:0 3px 0 var(--ink)}
.exlbl{flex:1;text-align:center;display:flex;flex-direction:column;line-height:1.2}
.exlbl small{color:var(--ink-soft);font-weight:600;font-size:13px}
.exlbl b{font-family:var(--display);font-weight:400;font-size:20px}
/* number hop */
.pvg{display:grid;grid-template-columns:minmax(96px,1fr) 34px minmax(96px,1fr) 34px minmax(80px,1fr) 34px minmax(80px,1fr);align-items:center;justify-items:center;row-gap:10px;max-width:640px;width:100%}
.pvg .pvcol{grid-row:1}
.pvsep{grid-row:1}
.pvpart,.pvplus{grid-row:2;font-family:var(--display);font-size:clamp(28px,4.4vw,46px);line-height:1}
.pvpart{border-top:3px dashed #c9d4dd;padding-top:10px;width:100%;text-align:center}
.pvpart.zero{color:#b7c3cd}
.pvplus{padding-top:13px;color:var(--ink-soft)}

.pv{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.pvcol{display:flex;flex-direction:column;align-items:center;gap:6px}
.pvcol>b{color:#fff;font-family:var(--display);font-weight:400;padding:4px 10px;border-radius:10px;border:2.5px solid var(--ink);font-size:16px}
.pvn{font-family:var(--display);font-size:38px;line-height:1}
.blocks{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:flex-end;min-height:80px}
.bgrp{display:flex;flex-direction:column;align-items:center;gap:4px}
.bgrp small{font-weight:700;font-size:14px}
.bset{display:flex;flex-wrap:wrap;gap:4px;max-width:260px;justify-content:center;align-items:flex-end}
.ones{display:grid;grid-template-columns:repeat(5,14px);gap:3px}
/* euro shop */
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;max-width:720px}
.coin{border-radius:12px;transition:transform .08s;line-height:0}
.coin:hover{transform:translateY(-2px)}.coin:active{transform:scale(.92)}
.tray{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;min-height:84px;width:100%;max-width:640px;background:#f3ead7;border:var(--line);border-radius:18px;padding:10px;box-shadow:inset 0 3px 0 rgba(22,50,79,.12)}
.tray .empty{color:var(--ink-soft);font-weight:500}
/* shapes */
.shapegrid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.shapebtn{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 var(--ink)}
.shapebtn small{font-weight:600;font-size:13px}
.shapebtn.on{background:var(--gold)}
.shapeinfo{display:flex;gap:20px;align-items:center;flex-wrap:wrap;justify-content:center;text-align:left}
.shapeinfo h3{margin:0 0 6px;font-size:32px}
.shapeinfo p{margin:4px 0;font-size:19px}
.opt svg{display:block}
/* treasure grid */
.gridwrap{display:grid;grid-template-columns:auto auto auto;gap:8px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(6,56px);grid-template-rows:repeat(6,56px);border:var(--line);border-radius:12px;overflow:hidden;background:#bfe7f6}
.gc{border-right:1.5px solid #8cc3df;border-bottom:1.5px solid #8cc3df;display:grid;place-items:center;font-size:32px}
.grid.tap .gc{cursor:pointer}.grid.tap .gc:hover{background:#d8f1fb}
.gc.good{background:var(--good)!important}.gc.bad{background:var(--bad)!important}
.ylab{display:grid;grid-template-rows:repeat(6,56px);align-items:center;font-weight:700;font-size:18px}
.xlab{display:grid;grid-template-columns:repeat(6,56px);text-align:center;font-weight:700;font-size:18px;margin-top:4px}
.compass{font-family:var(--display);text-align:center;font-size:18px;line-height:1.5;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:6px 8px}
.compass span{white-space:nowrap}
/* patterns */
.unit{display:flex;gap:6px;font-size:34px;min-height:52px;border:2.5px dashed var(--ink);border-radius:14px;padding:4px 12px;background:#fff}
.patrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:38px}
.patrow span.st{border-left:3px solid #c9d4dd;padding-left:4px}
.qm{display:inline-grid;place-items:center;min-width:48px;height:48px;border:3px dashed var(--ink);border-radius:12px;font-family:var(--display);font-size:30px;background:#fff6d6}
.seq{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.seq span:not(.qm){font-family:var(--display);font-size:34px;background:#fff;border:var(--line);border-radius:14px;padding:4px 14px;box-shadow:0 3px 0 var(--ink)}
.seq i{font-style:normal;font-weight:700;color:var(--purple);font-size:16px}
.box{display:inline-grid;place-items:center;min-width:64px;border:4px dashed var(--ink);border-radius:12px;background:#fff6d6;padding:0 8px}
/* data */
.chart{width:100%;max-width:560px;height:auto}
.picto{display:flex;flex-direction:column;gap:8px;background:#fff;border:var(--line);border-radius:16px;padding:12px 16px;min-width:min(420px,100%)}
.picto div{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px;border-bottom:1.5px dashed #d5dee6;padding-bottom:6px}
.picto b{font-weight:600}.picto span{font-size:26px;letter-spacing:2px}
.votes{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.votes div{display:flex;align-items:center;gap:6px;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:4px 8px}
.votes span{font-size:24px}.votes b{min-width:22px;text-align:center;font-family:var(--display);font-weight:400;font-size:22px}
/* cupla focal */
.gacard{display:flex;gap:24px;align-items:center;justify-content:center;flex-wrap:wrap;background:#e9f6ef;border:var(--line);border-radius:22px;padding:18px 24px;box-shadow:var(--ledge);min-width:min(460px,100%)}
.gapic{min-width:120px;display:flex;flex-direction:column;align-items:center}
.gaw{font-family:var(--display);font-size:48px;color:#1f8a57;line-height:1}
.gaen{font-size:22px;color:var(--ink-soft);font-weight:600;margin-top:4px}
.gagrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:680px}
.gagrid button{background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:6px 12px;display:flex;flex-direction:column;align-items:center;box-shadow:0 3px 0 var(--ink)}
.gagrid button.on{background:var(--gold)}
.gagrid small{color:var(--ink-soft);font-weight:500}
.dots{font-size:22px;letter-spacing:3px;color:var(--orange);max-width:140px;text-align:center;line-height:1.2}
.gnum{font-family:var(--display);font-weight:400;font-size:56px;line-height:1}
.gsym{font-family:var(--display);font-weight:400;font-size:70px;line-height:1}
@media (max-width:560px){
  .grid{grid-template-columns:repeat(6,44px);grid-template-rows:repeat(6,44px)}.ylab{grid-template-rows:repeat(6,44px)}.xlab{grid-template-columns:repeat(6,44px)}
  .gc{font-size:24px}.compass{display:none}.gridwrap{grid-template-columns:auto auto}
  .pvg{grid-template-columns:1fr 14px 1fr 14px 1fr 14px 1fr}.pvcol>b{font-size:12px;padding:3px 5px}.pvpart,.pvplus{font-size:22px}
  .gaw{font-size:38px}
  .seq span:not(.qm){font-size:26px;padding:3px 10px}
  .picto div{grid-template-columns:84px 1fr}.picto span{font-size:20px}
}

.curr{font-size:13.5px;color:var(--ink-soft);font-weight:600;margin:2px 0 8px;line-height:1.5}
.strand{display:inline-block;width:132px;height:26px;line-height:22px;letter-spacing:.2px;-webkit-font-smoothing:antialiased;vertical-align:middle;box-sizing:border-box;text-align:center;white-space:nowrap;color:#fff;font-weight:700;font-size:14px;padding:0 6px;border-radius:999px;border:2px solid var(--ink);margin-right:4px}
.modal .box.wide{max-width:760px}
.currbox{text-align:left}.currbox h2{text-align:center}
.currlist{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.curritem{display:grid;grid-template-columns:54px 1fr;gap:10px;border:2.5px solid var(--ink);border-radius:16px;padding:10px;background:#fff}
.ci-art svg{width:54px;height:54px}
.curritem h4{margin:0;font-size:19px}
.curritem p{margin:3px 0 0;font-size:14px;line-height:1.35}
.bystrand{display:flex;flex-direction:column;gap:8px;font-size:15px}
.bystrand>div{display:grid;grid-template-columns:132px 1fr;gap:10px;align-items:start}.bystrand .strand{margin:0}
@media (max-width:640px){.currlist{grid-template-columns:1fr}}
/* gaa */
.scoreboard{background:#14202b;border:var(--line);border-radius:16px;padding:12px 16px;color:#ffb347;font-family:var(--display);box-shadow:0 5px 0 var(--ink);min-width:min(460px,100%)}
.sbtitle{font-size:12px;letter-spacing:2px;color:#9fb3c4;text-align:center;margin-bottom:6px}
.sbrow{display:grid;grid-template-columns:40px 1fr 44px 16px 52px 56px;align-items:center;gap:6px;padding:6px 0;border-top:1px dashed #33485a}
.sbteam{color:#fff;font-size:22px;letter-spacing:1px}
.sbg,.sbp{font-size:38px;text-align:center;background:#0b1218;border-radius:8px;color:#ffb347;line-height:1.2}
.sbdash{font-size:30px;text-align:center}.sbt{font-size:20px;color:#7fd17f;text-align:right}
.sbkey{display:grid;grid-template-columns:40px 1fr 44px 16px 52px 56px;gap:6px;font-size:10px;color:#9fb3c4;letter-spacing:1px}
.sbkey span:nth-child(1){grid-column:3}.sbkey span:nth-child(2){grid-column:5}.sbkey span:nth-child(3){grid-column:6;text-align:right}
.sbctl{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}.sbctl>div{display:flex;flex-direction:column;align-items:center;gap:6px}
.working{font-size:18px;line-height:1.6;text-align:center}
.bigscore{display:flex;align-items:center;gap:14px;font-family:var(--display);font-size:64px}
/* bake */
.recipe{background:#fff;border:var(--line);border-radius:18px;padding:16px 18px;box-shadow:0 4px 0 var(--ink);width:100%;max-width:560px;background-image:repeating-linear-gradient(transparent 0 31px,#e8eef3 31px 32px)}
.rhead{display:flex;gap:12px;align-items:center;margin-bottom:8px}.rem{font-size:52px}.rhead h3{margin:0;font-size:28px}.rhead p{margin:2px 0 0}.rhead span{color:var(--ink-soft);font-size:15px}
.recipe table{width:100%;border-collapse:collapse;font-size:18px}.recipe th{text-align:left;font-size:14px;color:var(--ink-soft)}.recipe td{padding:6px 4px;border-top:1.5px dashed #d5dee6}.recipe td small{color:var(--ink-soft)}
.emrow{font-size:40px;letter-spacing:4px;text-align:center;max-width:520px}
.jugs{display:flex;gap:30px}
.mhead{margin:12px 0 4px;font-size:20px}
.method{margin:0;padding-left:24px;font-size:16.5px;line-height:1.45}
.method li{margin:3px 0}
.method li.hot span{display:inline-block;font-size:12px;font-weight:700;background:#fde2d6;border:1.5px solid var(--red);border-radius:999px;padding:0 6px;color:#b23a26;white-space:nowrap}
.safety{margin:8px 0 0;font-size:13.5px;color:var(--ink-soft)}
#rp{max-width:680px}
/* calendar */
.calwrap{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.cal{background:#fff;border:var(--line);border-radius:16px;padding:10px;box-shadow:0 4px 0 var(--ink)}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}.calhead b{font-family:var(--display);font-weight:400;font-size:22px;flex:1;text-align:center}
.calgrid{display:grid;grid-template-columns:repeat(7,40px);gap:4px}
.cdn{font-size:13px;font-weight:700;text-align:center;color:var(--ink-soft)}
.cd{height:38px;border-radius:9px;border:2px solid #d5dee6;font-weight:600;font-size:16px;background:#fff}
.cd.wk{background:#f3f7fa}.cd.today{border-color:var(--red)}.cd.sel{background:var(--gold);border-color:var(--ink)}.cd.empty{border:none;background:none}
.calinfo{max-width:290px}.calinfo h3{margin:0 0 6px;font-size:26px;line-height:1.1}.calinfo p{margin:2px 0;font-size:16px}.calinfo ul{margin:4px 0;padding-left:18px;font-size:15px}
.months{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:620px}.months span{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:3px 8px;font-size:14px}.months span.on{background:var(--gold)}
/* number detectives */
.hsq{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:100%;max-width:470px}
.hn{aspect-ratio:1;border:1.5px solid #c9d4dd;border-radius:6px;background:#fff;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.hn.on{background:var(--gold);border-color:var(--ink)}.hn.ev{background:#d6ebf8}.hn.od{background:#fde9c6}.hn.sel{outline:3px solid var(--red);outline-offset:1px}
.detinfo{text-align:center}.detinfo h3{margin:0;font-size:36px}.detinfo p{margin:4px 0;font-size:17px}
.chip{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;margin:2px;font-weight:700;font-size:14px;background:#fff}.chip.p{background:#e6dcfb}.chip.s{background:#d4f0df}
.key{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:15px}.key i{width:18px;height:18px;border-radius:5px;border:2px solid var(--ink);display:block}.key i.ev{background:#d6ebf8}.key i.od{background:#fde9c6}.key i.on{background:var(--gold)}
/* sprint */
.strat{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.sname{background:var(--purple);color:#fff;font-family:var(--display);font-size:22px;padding:4px 16px;border-radius:999px;border:var(--line)}
.steps{margin:0;padding-left:28px;font-size:22px;line-height:1.5;font-weight:600;max-width:520px}
.ansgood{color:var(--good)}
@media (max-width:560px){
  .sbrow,.sbkey{grid-template-columns:30px 1fr 34px 10px 40px 44px}.sbteam{font-size:16px}.sbg,.sbp{font-size:28px}.sbt{font-size:15px}
  .bigscore{font-size:46px}
  .calgrid{grid-template-columns:repeat(7,38px)}
  .hn{font-size:11px;border-radius:4px}
  .steps{font-size:18px}
  .recipe table{font-size:15px}
}
/* modal */
.modal{position:fixed;inset:0;background:rgba(22,50,79,.55);display:grid;place-items:center;z-index:50;padding:18px}
.modal.hidden{display:none}
.modal .box{background:var(--paper);border:var(--line);border-radius:28px;padding:24px;max-width:460px;width:100%;text-align:center;box-shadow:0 8px 0 var(--ink);animation:pop .35s cubic-bezier(.2,1.4,.4,1);max-height:92dvh;overflow:auto}
.modal h2{margin:0 0 6px;font-size:34px}
.stars{font-size:40px;letter-spacing:6px;margin:6px 0}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--gold);border:var(--line);border-radius:999px;padding:6px 14px;font-weight:700;margin:6px 0 12px}
.helpbox{text-align:left;max-width:560px}
.helpbox h2{text-align:center}
.helpgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.helpgrid div{border:var(--line);border-radius:16px;padding:12px}
.helpgrid h4{margin:0 0 6px;font-size:21px}
.helpgrid ul{margin:0;padding-left:18px;font-size:15px;line-height:1.4}
.helpnote{font-size:15px;color:var(--ink-soft)}

/* passport */
.pp-head{display:flex;gap:18px;align-items:center;background:#7a1f33;color:#f7e6b5;border:var(--line);border-radius:24px;padding:20px 24px;box-shadow:0 6px 0 var(--ink);margin-bottom:18px}
.pp-head h2{margin:0;font-size:40px;color:#f7e6b5}
.pp-head p{margin:4px 0 0;font-size:17px;opacity:.9}
.pp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.stamp{background:var(--paper);border:var(--line);border-radius:20px;padding:18px;text-align:center;box-shadow:var(--ledge)}
.stamp .ring{width:110px;height:110px;margin:0 auto 10px;border-radius:50%;border:5px solid var(--red);display:grid;place-items:center;font-size:46px;transform:rotate(-8deg);color:var(--red)}
.stamp.off .ring{border-color:#c7d2db;filter:grayscale(1);opacity:.45}
.stamp h4{margin:0;font-size:22px}
.stamp p{margin:4px 0 0;color:var(--ink-soft);font-size:15px}

@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:16px}
  .modes{grid-template-columns:1fr 1fr}
  .play{grid-template-columns:1fr;gap:12px}
  .stage{min-height:0;padding:16px}
  .panel{display:contents}
  .play>.stage{order:2}
  .modeswitch{order:1}
  .intro{order:1;padding:12px 14px}
  .intro h3,.intro p{display:none}
  .intro>div[style]{margin-top:0!important}
  .play.learn .intro{display:none}
  #says{order:3}
  #ready{order:4}
  .pp-grid{grid-template-columns:1fr}
}
@media (max-width:560px){
  .app{padding:12px 12px 24px}
  .exbar{gap:6px;padding:6px}.exbar .btn{padding:6px 9px;font-size:14px}.exlbl b{font-size:16px}
  .brand span.t{font-size:20px}
  .pill .lbl{display:none}
  .hero p{font-size:18px}
  .mode .art{height:96px}.mode .art svg{width:70px;height:70px}
  .mode h3{font-size:19px}.mode p{font-size:14px}
  .mode .tag{display:none}
  .frame{grid-template-columns:repeat(5,40px);gap:5px}
  .frame .cell{width:40px;height:40px}.frame .cell i{width:28px;height:28px}
  .frame .cell i.x:after{top:11px}
  .array i{width:15px;height:15px}
  .facts{grid-template-columns:repeat(3,1fr)}
  .opt{min-width:84px;font-size:26px;padding:12px 14px}
  .opt.wide{min-width:0;width:100%;font-size:19px}
  .keypad{grid-template-columns:repeat(3,64px)}
  .keypad button{height:52px}
  .helpgrid{grid-template-columns:1fr}
  .fracbig{font-size:52px}
  .tbox{min-width:120px;padding:8px 12px}.tbox b{font-size:28px}.tbox.words b{font-size:20px}
}
.pill[hidden]{display:none}a.pill{text-decoration:none;color:var(--ink)}
</style>
</head>
<body>

const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

// ---------- sound ----------
let actx=null;
function tone(freqs,dur=.12){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); let t=actx.currentTime;
  freqs.forEach(f=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur); t+=dur*.8; }); }catch(e){} }
const yay=()=>tone([660,880,1100],.11), nope=()=>tone([220,180],.14);

// ---------- number words ----------
const W1=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];

const numWord=n=>n<20?W1[n]:W10[Math.floor(n/10)]+(n%10?'-'+W1[n%10]:'');

let CUR=null, TIMER=null;
function stopTimer(){ if(TIMER){ clearInterval(TIMER); TIMER=null; } }
function openGame(key, mode){ mode=mode||'learn'; stopTimer(); closeModal(); CUR={key,mode}; GAMES[key][mode](); window.scrollTo(0,0); }

// shell: left stage, right panel

// step through worked examples in Learn mode (for teachers at the board)
function exampleBar(where, list, apply, label){ let k=0; const host=$(where); if(!host) return;
  host.querySelectorAll(':scope > .exbar').forEach(e=>e.remove());
  host.insertAdjacentHTML('afterbegin',`<div class="exbar"><button class="btn small" data-ex="-1" aria-label="Previous example">◀ Back</button><div class="exlbl"><small>Example <span class="exn">1</span> of ${list.length}</small><b class="ext"></b></div><button class="btn small primary" data-ex="1">Next example ▶</button></div>`);
  const bar=host.querySelector(':scope > .exbar');
  const go=i=>{ k=(i+list.length)%list.length; bar.querySelector('.exn').textContent=k+1; bar.querySelector('.ext').textContent=label(list[k]); apply(list[k]); };
  bar.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{ tone([560],.05); go(k+ +b.dataset.ex); });
  go(0);
  // jump to the first example that matches (used when a tab is clicked); returns false if none
  return { go, jump(pred){ const j=list.findIndex(pred); if(j<0) return false; go(j); return true; } }; }
function shell(intro, stageHTML, panelExtra=''){
  const g=GAMES[CUR.key], learn=CUR.mode==='learn';
  view.innerHTML=`<div class="play ${learn?'learn':''}">
    <section class="stage" id="stage">${stageHTML}</section>
    <aside class="panel">
      <div class="modeswitch" role="tablist"><button data-m="learn" class="${learn?'on':''}">📖 Learn</button><button data-m="play" class="${learn?'':'on'}">🎮 Play</button></div>
      <div class="card intro"><h3>${g.title}</h3>${CURR[CUR.key]?currTag(CUR.key):''}<p>${intro}</p>${panelExtra}</div>
      ${learn?`<button class="btn primary" id="ready">🎮 I'm ready, let's play!</button>`:''}
      <div class="bubble" id="says"></div>
    </aside></div>`;
  $$('.modeswitch button').forEach(b=>b.onclick=()=>{ if(b.dataset.m!==CUR.mode) openGame(CUR.key,b.dataset.m); });
  if(learn) $('#ready').onclick=()=>openGame(CUR.key,'play');
}
function say(html){ const el=$('#says'); if(el) el.innerHTML=html; }
const progressDots=n=>`<div class="progress" id="prog">${'<i></i>'.repeat(n)}</div>`;
function markProg(i,cls){ const d=$$('#prog i')[i]; if(d){ d.className=cls; } }

function finish(key, score, total, extra=''){
  stopTimer();
  const pct=score/total, stars=pct>=.9?3:pct>=.6?2:1, [em,bname]=GAMES[key].badge;
  const prev=(S.badges[key]||0); let fresh=false;
  if(stars>prev){ S.badges[key]=stars; fresh=prev===0; }
  S.plays=(S.plays||0)+1; save(); yay();
  modal(`<h2>${pct>=.9?'Brilliant!':pct>=.6?'Great job!':'Good try!'}</h2><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <p style="font-size:19px;margin:4px 0">You got <b>${score} out of ${total}</b>.</p>${extra}
    ${fresh?`<div class="badge">${em} New badge: ${bname}</div>`:''}
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px"><button class="btn" id="mHome">🏠 Home</button><button class="btn" id="mLearn">📖 Learn</button><button class="btn primary" id="mAgain">Play again</button></div>`,'sticky');
  $('#mHome').onclick=()=>{ closeModal(); home(); };
  $('#mLearn').onclick=()=>openGame(key,'learn');
  $('#mAgain').onclick=()=>openGame(key,'play');
}

// generic multiple choice: options = [{label, value}], correct value
function choices(el, opts, correctVal, onDone, wide=false){
  el.innerHTML=opts.map((o,i)=>`<button class="opt ${wide?'wide':''}" data-i="${i}">${o.label}</button>`).join('');
  let done=false;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(done) return; done=true; const o=opts[+b.dataset.i], ok=o.value===correctVal;
    if(ok){ b.classList.add('good'); yay(); } else { b.classList.add('bad','shake'); nope(); el.querySelectorAll('.opt').forEach(x=>{ if(opts[+x.dataset.i].value===correctVal) x.classList.add('good'); }); }
    setTimeout(()=>onDone(ok), ok?750:1500); });
}
function uniqOpts(correct, makeWrong, n, fmt){ const set=new Map([[String(correct),correct]]); let guard=0;
  while(set.size<n && guard++<200){ const w=makeWrong(); if(w!==undefined && w!==null) set.set(String(w),w); }
  return shuffle([...set.values()]).map(v=>({label:fmt?fmt(v):String(v), value:v})); }

// =====================================================================
// TIMES TABLE TRAIL
// =====================================================================
function frameHTML(reds, blues, crossed=0, tap=false, id=''){ // up to 20 across two frames
  const cells=[]; for(let i=0;i<20;i++){ let c=''; if(i<reds) c=i>=reds-crossed?'x':'r'; else if(i<reds+blues) c='b'; cells.push(c); }
  const one=k=>`<div class="frame ${tap?'tap':''}" ${id?`data-f="${k}"`:''}>${cells.slice(k*10,k*10+10).map((c,j)=>`<div class="cell" data-i="${k*10+j}">${c?`<i class="${c}"></i>`:''}</div>`).join('')}</div>`;
  return `<div class="frames" ${id?`id="${id}"`:''}>${one(0)}${reds+blues>10||tap?one(1):''}</div>`; }
function arrayHTML(r,c){ return `<div class="array" style="grid-template-columns:repeat(${c},auto)">${[...Array(r*c)].map((_,i)=>`<i class="${Math.floor(i/c)%2?'row-alt':''}"></i>`).join('')}</div>`; }

function learnTables(){

function playTables(){
  const jr=S.level==='junior';
  if(jr){
    const N=10; let i=0, score=0;
    shell('Look at the counters, then pick the right answer.', `<div class="q" id="q"></div><div id="vis"></div><div class="opts" id="opts"></div>`, `<div style="margin-top:10px">${progressDots(N)}</div>`);
    function ask(){ markProg(i,'now');
      const add=Math.random()<.6; let a,b,ans;
      if(add){ a=rnd(1,10); b=rnd(1,Math.min(10,20-a)); ans=a+b; $('#q').textContent=`${a} + ${b} = ?`; $('#vis').innerHTML=frameHTML(a,b); }
      else { a=rnd(3,20); b=rnd(1,a-1); ans=a-b; $('#q').textContent=`${a} − ${b} = ?`; $('#vis').innerHTML=frameHTML(a,0,b); }
      say(add?'Count all the counters together.':'The crossed-out counters are taken away. How many are left?');
      choices($('#opts'), uniqOpts(ans,()=>{ const w=ans+pick([-2,-1,1,2,10,-10]); return w>=0&&w<=20?w:null; },3), ans, ok=>{ if(ok) score++; markProg(i,ok?'ok':'no'); if(++i<N) ask(); else finish('tables',score,N); });
    }
    ask();
  } else {
    const N=20; let i=0, score=0, typed='', acc=0, t0=0, running=false, facts=[];
    const elapsed=()=>acc+(running?Date.now()-t0:0);
    for(let a=2;a<=12;a++) for(let b=2;b<=12;b++) facts.push([a,b]);
    facts=shuffle(facts).slice(0,N);
    const best=S.best.tables;
    shell(`Answer 20 times-table questions as fast as you can. Press Start to begin the clock, and Stop to pause it.`,
      `<div class="q" id="q"></div><div class="answer" id="ans">&nbsp;</div><div class="keypad" id="kp">${[7,8,9,4,5,6,1,2,3].map(d=>`<button data-d="${d}">${d}</button>`).join('')}<button data-d="del">⌫</button><button data-d="0">0</button><button data-d="ok" class="ok">✓</button></div>`,
      `<div style="margin-top:10px">${progressDots(N)}</div><div class="statline"><span>⏱️ <span id="clk">0.0</span>s</span><button class="btn small primary" id="tgo">▶ Start</button><span>${best?`🏆 ${best.toFixed(1)}s`:'🏆 No best yet'}</span></div>`);
    TIMER=setInterval(()=>{ const c=$('#clk'); if(c) c.textContent=(elapsed()/1000).toFixed(1); },100);
    let locked=false;
    function ask(){ typed=''; locked=false; markProg(i,'now'); $('#ans').className='answer'; $('#ans').innerHTML='&nbsp;'; showQ(); }
    function showQ(){ const [a,b]=facts[i], fresh=i===0&&acc===0;
      if(!running){ $('#q').innerHTML=`<span style="color:var(--ink-soft)">${fresh?'Ready?':'⏸ Paused'}</span>`; say(fresh?'Press <b>▶ Start</b> when you\'re ready. The clock starts when you press it, and you can stop it any time.':'The clock is stopped. Press <b>▶ Start</b> to carry on.'); return; }
      $('#q').textContent=`${a} × ${b} = ?`; say(i===0&&typed===''?'Go! Type the answer, then press ✓ or Enter.':''); }
    $('#tgo').onclick=()=>{ if(running){ acc+=Date.now()-t0; running=false; $('#tgo').textContent='▶ Start'; } else { t0=Date.now(); running=true; $('#tgo').textContent='⏸ Stop'; } tone([running?700:400],.06); showQ(); };
    function key(d){ if(locked) return; if(!running){ say('Press <b>▶ Start</b> first!'); return; }
      if(d==='del'){ typed=typed.slice(0,-1); } else if(d==='ok'){ if(!typed) return; check(); return; } else if(typed.length<3){ typed+=d; }
      $('#ans').innerHTML=typed||'&nbsp;'; }
    function check(){ locked=true; const [a,b]=facts[i], ok=+typed===a*b;
      if(ok){ score++; yay(); $('#ans').classList.add('good'); } else { nope(); $('#ans').classList.add('bad','shake'); $('#ans').textContent=a*b; say(`${a} × ${b} = <b>${a*b}</b>. You'll get it next time!`); }
      markProg(i,ok?'ok':'no');
      setTimeout(()=>{ if(++i<N) ask(); else done(); }, ok?350:1400); }
    function done(){ const secs=elapsed()/1000; let extra=`<p style="margin:2px 0">⏱️ Time: <b>${secs.toFixed(1)} seconds</b></p>`;
      if(score>=18 && (!S.best.tables || secs<S.best.tables)){ S.best.tables=secs; save(); extra+=`<p style="margin:2px 0">🏆 <b>New best time!</b></p>`; }
      else if(score<18) extra+=`<p style="margin:2px 0;font-size:15px;color:var(--ink-soft)">Get 18 or more right to set a best time.</p>`;
      document.removeEventListener('keydown',onKey); finish('tables',score,N,extra); }
    $$('#kp button').forEach(b=>b.onclick=()=>key(b.dataset.d));
    function onKey(e){ if(!$('#kp')){ document.removeEventListener('keydown',onKey); return; } if(/^[0-9]$/.test(e.key)) key(e.key); else if(e.key==='Backspace') key('del'); else if(e.key==='Enter') key('ok'); }
    document.addEventListener('keydown',onKey);
    ask();
  }
}

const gcd=(a,b)=>b?gcd(b,a%b):a;
const FW={2:['half','halves'],3:['third','thirds'],4:['quarter','quarters'],5:['fifth','fifths'],6:['sixth','sixths'],8:['eighth','eighths'],10:['tenth','tenths'],12:['twelfth','twelfths']};
const fracWord=(n,d)=>`${numWord(n)} ${n===1?FW[d][0]:FW[d][1]}`;
const fracHTML=(n,d,cls='')=>`<span class="frac ${cls}"><b>${n}</b><b>${d}</b></span>`;
function pizzaSVG(d, on, id='pz'){
  const R=150, r=128, cx=160, cy=160; let s=`<svg class="pizza" id="${id}" viewBox="0 0 320 320" role="img" aria-label="Pizza cut into ${d} slices"><circle cx="${cx}" cy="${cy+6}" r="${R}" fill="${INK}"/><circle cx="${cx}" cy="${cy}" r="${R}" fill="#e2a24f" stroke="${INK}" stroke-width="4"/>`;
  for(let i=0;i<d;i++){ const a0=-Math.PI/2+i*2*Math.PI/d, a1=a0+2*Math.PI/d, large=d===1?1:0;
    const p=d===1?`M${cx} ${cy-r}A${r} ${r} 0 1 1 ${cx-.01} ${cy-r}Z`:`M${cx} ${cy}L${cx+r*Math.cos(a0)} ${cy+r*Math.sin(a0)}A${r} ${r} 0 ${large} 1 ${cx+r*Math.cos(a1)} ${cy+r*Math.sin(a1)}Z`;
    const am=(a0+a1)/2, half=Math.PI/d, spots=d<=2?[[.5,0],[.3,.5],[.75,.45],[.75,-.45],[.45,-.6]]:d<=4?[[.55,0],[.32,.0],[.78,.4],[.78,-.4]]:d<=6?[[.45,0],[.72,.35],[.72,-.35]]:[[.5,0],[.8,0]];
    const tops=on.has(i)?spots.map(([f,da])=>{ const aa=am+da*half; return `<circle cx="${cx+r*f*Math.cos(aa)}" cy="${cy+r*f*Math.sin(aa)}" r="${d>8?7:d>4?9:11}" fill="#d9483a" stroke="${INK}" stroke-width="2"/>`; }).join(''):'';
    s+=`<g class="slice" data-i="${i}"><path d="${p}" fill="${on.has(i)?'#ffcf5c':'#fff3c4'}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>${tops}</g>`; }
  return s+'</svg>'; }
function fracFacts(n,d){ const g=gcd(n,d), parts=[];
  if(n===0) return '<span>No pepperoni yet. Tap a slice!</span>';
  if(n===d) parts.push(`<div>The <b>whole</b> pizza: ${fracHTML(n,d)} = 1</div>`);
  else if(g>1) parts.push(`<div>Same as ${fracHTML(n/g,d/g)} <span>(${fracWord(n/g,d/g)})</span></div>`);
  const dec=n/d; const exact=[2,4,5,8,10].includes(d/g);
  parts.push(`<div>Decimal: <b>${exact?String(+dec.toFixed(3)):'about '+dec.toFixed(2)}</b></div>`);
  parts.push(`<div>Percent: <b>${exact?String(+(dec*100).toFixed(1)):'about '+Math.round(dec*100)}%</b></div>`);
  return parts.join(''); }
function learnPizza(){
  let d=4; const on=new Set();

    `<div class="slicecount" id="sc">${[2,3,4,5,6,8,10,12].map(n=>`<button class="btn small" data-d="${n}">${n} slices</button>`).join('')}</div>

    say(on.size?`<b>${on.size}</b> out of <b>${d}</b> slices have pepperoni. That's <b>${fracWord(on.size,d)}</b>.`:`The pizza is cut into <b>${d}</b> equal slices. Each slice is <b>one ${FW[d][0]}</b>.`); }
  exampleBar('#stage',[[2,1],[4,1],[4,3],[3,2],[8,4],[10,7],[6,5]],([dd,nn])=>{ d=dd; on.clear(); for(let x=0;x<nn;x++) on.add(x); draw(); },([dd,nn])=>`${fracWord(nn,dd)} (${nn}/${dd})`);

function playPizza(){
  const jr=S.level==='junior', N=jr?8:10; let i=0, score=0;
  shell(jr?'Look at the pizza and answer the question.':'Fractions, decimals and percentages. Pick the right answer.',
    `<div class="q" id="q" style="font-size:clamp(26px,3.6vw,38px)"></div><div id="vis" style="display:flex;justify-content:center"></div><div class="opts" id="opts"></div><div id="act"></div>`,

          $('#chk').disabled=true; setTimeout(()=>next(ok), ok?900:1800); };

      if(type==='equiv'){
        const [n,d]=pick([[1,2],[1,3],[2,3],[1,4],[3,4],[2,5]]), m=pick([2,3,4].filter(k=>d*k<=12||k===2));
        $('#q').innerHTML=`Which fraction is the same as ${fracHTML(n,d)}?`;
        $('#vis').innerHTML=pizzaSVG(d,new Set([...Array(n).keys()]),'pzq');
        const right=[n*m,d*m], wrong=[[n*m+1,d*m],[n+m,d+m],[n*m,d*m+m],[n*m-1,d*m],[d*m-n*m,d*m]].filter(([a,b])=>a>0&&a<b&&a*d!==n*b);
        const opts=shuffle([right,...shuffle(wrong).slice(0,3)]).map(([a,b])=>({label:fracHTML(a,b),value:a+'/'+b}));
        say('Equal fractions cover the same amount of pizza.'); choices($('#opts'),opts,right.join('/'),next);
      } else if(type==='of'){
        const [n,d]=pick([[1,2],[1,4],[3,4],[1,3],[2,3],[1,5],[2,5],[1,10],[3,10]]), k=rnd(2,10), total=d*k, ans=n*k;
        const item=pick([['sweets','🍬'],['euro','💶'],['stickers','⭐'],['apples','🍎']]);
        $('#q').innerHTML=`What is ${fracHTML(n,d)} of ${total} ${item[0]}? ${item[1]}`;
        say(`Share ${total} into ${d} equal groups, then take ${n} of the groups.`);
        choices($('#opts'),uniqOpts(ans,()=>{ const w=pick([ans+k,ans-k,k,total-ans,ans+1,ans-1]); return w>0&&w!==ans?w:null; },4),ans,next);
      } else if(type==='pct'){
        const [n,d,p,dec]=pick([[1,2,50,'0.5'],[1,4,25,'0.25'],[3,4,75,'0.75'],[1,5,20,'0.2'],[2,5,40,'0.4'],[1,10,10,'0.1'],[7,10,70,'0.7'],[3,5,60,'0.6']]);
        const asPct=Math.random()<.5;
        $('#q').innerHTML=`${fracHTML(n,d)} as a ${asPct?'percentage':'decimal'} is…`;
        const pctPool=[10,20,25,30,40,50,60,70,75,80], decPool=['0.1','0.2','0.25','0.3','0.4','0.5','0.6','0.7','0.75','0.8'];
        const right=asPct?p+'%':dec, pool=(asPct?pctPool.map(x=>x+'%'):decPool).filter(x=>x!==right);
        say(asPct?'Per cent means "out of 100".':'Think of tenths and hundredths.');
        choices($('#opts'),shuffle([right,...shuffle(pool).slice(0,3)]).map(x=>({label:x,value:x})),right,next);
      } else {
        const fr=shuffle([[1,2],[1,3],[2,3],[1,4],[3,4],[2,5],[3,5],[5,8],[3,8],[7,10]]).slice(0,2);

      }
    }

}

function timeWords(h,m){ const H=h%12||12, nx=(h+1)%12||12;
  if(m===0) return `${numWord(H)} o'clock`;
  if(m===15) return `quarter past ${numWord(H)}`;
  if(m===30) return `half past ${numWord(H)}`;
  if(m===45) return `quarter to ${numWord(nx)}`;
  if(m<30) return `${numWord(m)}${m%5?(m===1?' minute':' minutes'):''} past ${numWord(H)}`;
  const t=60-m; return `${numWord(t)}${t%5?(t===1?' minute':' minutes'):''} to ${numWord(nx)}`; }
const pad=n=>String(n).padStart(2,'0');
const t12=(h,m)=>`${h%12||12}:${pad(m)}`;
const t24=(h,m)=>`${pad(h)}:${pad(m)}`;
function clockSVG(h,m,id='clk'){
  const cx=160,cy=160; let s=`<svg class="clock" id="${id}" viewBox="0 0 320 320" role="img" aria-label="Clock showing ${t12(h,m)}"><circle cx="${cx}" cy="${cy+6}" r="146" fill="${INK}"/><circle cx="${cx}" cy="${cy}" r="146" fill="#fff" stroke="${INK}" stroke-width="6"/><circle cx="${cx}" cy="${cy}" r="132" fill="none" stroke="#e4eef4" stroke-width="10"/>`;
  for(let i=0;i<60;i++){ const a=i*Math.PI/30, r1=i%5?126:118; s+=`<line x1="${cx+r1*Math.sin(a)}" y1="${cy-r1*Math.cos(a)}" x2="${cx+132*Math.sin(a)}" y2="${cy-132*Math.cos(a)}" stroke="${INK}" stroke-width="${i%5?2:4}"/>`; }
  for(let i=1;i<=12;i++){ const a=i*Math.PI/6; s+=`<text x="${cx+100*Math.sin(a)}" y="${cy-100*Math.cos(a)+11}" text-anchor="middle" font-family="Lilita One, sans-serif" font-size="32" fill="${INK}">${i}</text>`; }
  const ha=((h%12)+m/60)*Math.PI/6, ma=m*Math.PI/30;
  s+=`<line class="hand hh" x1="${cx}" y1="${cy}" x2="${cx+62*Math.sin(ha)}" y2="${cy-62*Math.cos(ha)}" stroke="${INK}" stroke-width="13" stroke-linecap="round"/>`;
  s+=`<g class="hand mh"><line x1="${cx}" y1="${cy}" x2="${cx+108*Math.sin(ma)}" y2="${cy-108*Math.cos(ma)}" stroke="#e5604e" stroke-width="8" stroke-linecap="round"/><circle cx="${cx+108*Math.sin(ma)}" cy="${cy-108*Math.cos(ma)}" r="14" fill="#e5604e" fill-opacity=".001"/></g>`;
  return s+`<circle cx="${cx}" cy="${cy}" r="11" fill="${INK}"/><circle cx="${cx}" cy="${cy}" r="4" fill="#ffc933"/></svg>`; }
// drag the minute hand; calls set(newTotalMinutes)
function dragClock(svgId, get, set, step){
  const svg=$('#'+svgId); let dragging=false, last=null;
  const angleAt=e=>{ const r=svg.getBoundingClientRect(), x=e.clientX-r.left-r.width/2, y=e.clientY-r.top-r.height/2; return (Math.atan2(x,-y)+2*Math.PI)%(2*Math.PI); };
  svg.addEventListener('pointerdown',e=>{ dragging=true; last=null; svg.setPointerCapture(e.pointerId); move(e); });
  svg.addEventListener('pointermove',e=>{ if(dragging) move(e); });
  svg.addEventListener('pointerup',()=>{ dragging=false; });
  function move(e){ let mins=Math.round(angleAt(e)/(2*Math.PI)*60/step)*step%60; const tot=get(), cur=tot%60;

function polySVG(n, col, size=120, rot=-Math.PI/2){ const c=size/2, r=size*.42; const pts=[...Array(n)].map((_,k)=>{ const a=rot+k*2*Math.PI/n; return `${(c+r*Math.cos(a)).toFixed(1)},${(c+r*Math.sin(a)).toFixed(1)}`; }).join(' ');
  return `<polygon points="${pts}" fill="${col}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`; }

  triangle:{name:'Triangle',sides:3,corners:3,eg:'a slice of pizza or a road sign',draw:s=>polySVG(3,'#ffc933',s)},

const shape2SVG=(k,s=120)=>`<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}">${SHAPES2[k].draw(s)}</svg>`;
const shape3SVG=(k,s=130)=>`<svg width="${s}" height="${s*.9}" viewBox="0 0 130 115"><g stroke="${INK}" stroke-width="3.5" stroke-linejoin="round" fill="none">${SH3D[k].d}</g></svg>`;
function angleSVG(deg){ const a=deg*Math.PI/180, L=110; return `<svg width="220" height="150" viewBox="0 0 220 150"><path d="M40 125 H${40+L+40}" stroke="${INK}" stroke-width="6" stroke-linecap="round"/><path d="M40 125 L${40+L*Math.cos(a)} ${125-L*Math.sin(a)}" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>${deg===90?`<path d="M62 125V103H40" fill="none" stroke="#e5604e" stroke-width="4"/>`:`<path d="M80 125A40 40 0 0 0 ${40+40*Math.cos(a)} ${125-40*Math.sin(a)}" fill="none" stroke="#e5604e" stroke-width="4"/>`}</svg>`; }
function learnShapes(){

  bar=exampleBar('#stage',[['2d','triangle'],['2d','square'],['2d','rectangle'],['2d','hexagon'],['2d','circle'],['3d','cube'],['3d','cuboid'],['3d','cylinder'],['3d','pyramid'],['3d','prism']],([dd,k])=>{ dim=dd; sel=k; draw(); },([dd,k])=>(dd==='2d'?SHAPES2:SH3D)[k].name);

const GN=6;
function gridHTML(o){ // o: {boat:[x,y], star:[x,y], marks:[[x,y,cls]], tap:true}
  let s=`<div class="gridwrap"><div class="ylab">${[...Array(GN)].map((_,k)=>`<span>${GN-k}</span>`).join('')}</div><div><div class="grid ${o.tap?'tap':''}">`;
  for(let y=GN;y>=1;y--) for(let x=1;x<=GN;x++){ const isB=o.boat&&o.boat[0]===x&&o.boat[1]===y, isS=o.star&&o.star[0]===x&&o.star[1]===y, mk=(o.marks||[]).find(m=>m[0]===x&&m[1]===y);
    s+=`<div class="gc ${mk?mk[2]:''}" data-x="${x}" data-y="${y}">${isB?'⛵':isS?'💎':''}</div>`; }
  return s+`</div><div class="xlab">${[...Array(GN)].map((_,k)=>`<span>${k+1}</span>`).join('')}</div></div><div class="compass">N<br><span>W ✛ E</span><br>S</div></div>`; }
function learnGrid(){
  let boat=[1,1];
  shell('Move the boat with the arrows, or tap any square. Coordinates are written (across, up).',
    `<div id="gw"></div><div class="nudge"><button class="btn small" data-m="0,1">⬆️ North</button><button class="btn small" data-m="-1,0">⬅️ West</button><button class="btn small" data-m="1,0">➡️ East</button><button class="btn small" data-m="0,-1">⬇️ South</button></div><div class="sentence" id="gco"></div>`);
  $$('.nudge .btn').forEach(b=>b.onclick=()=>{ const [dx,dy]=b.dataset.m.split(',').map(Number); const nx=boat[0]+dx, ny=boat[1]+dy;
    if(nx<1||ny<1||nx>GN||ny>GN){ nope(); say('Oops, that would sail off the map!'); return; } boat=[nx,ny]; tone([600],.05); draw(`You sailed one square <b>${dx>0?'east':dx<0?'west':dy>0?'north':'south'}</b>.`); });
  function draw(msg){ $('#gw').innerHTML=gridHTML({boat,tap:true}); $('#gco').textContent=`(${boat[0]}, ${boat[1]})`;
    $$('#gw .gc').forEach(c=>c.onclick=()=>{ boat=[+c.dataset.x,+c.dataset.y]; tone([700],.05); draw(); });
    say(msg||`The boat is <b>${boat[0]}</b> across and <b>${boat[1]}</b> up, so its coordinates are <b>(${boat[0]}, ${boat[1]})</b>. Go along the corridor, then up the stairs!`); }
  exampleBar('#stage',[[1,1],[3,2],[5,1],[2,5],[4,4],[6,6]],([x,y])=>{ boat=[x,y]; draw(); },([x,y])=>`The boat at (${x}, ${y})`);
}
function playGrid(){
  const jr=S.level==='junior', N=8; let i=0, score=0;
  shell(jr?'Follow the arrows and tap where the boat ends up.':'Coordinates and compass directions.',`<div class="q" id="q" style="font-size:clamp(24px,3.4vw,36px)"></div><div id="vis"></div><div class="opts" id="opts"></div>`,`<div style="margin-top:10px">${progressDots(N)}</div>`);
  const next=ok=>{ if(ok) score++; markProg(i,ok?'ok':'no'); if(++i<N) ask(); else finish('grid',score,N); };
  const ARW={'1,0':'➡️','-1,0':'⬅️','0,1':'⬆️','0,-1':'⬇️'}, CMP={'1,0':'east','-1,0':'west','0,1':'north','0,-1':'south'};
  function tapAsk(o, target, wrongMsg){ $('#vis').innerHTML=gridHTML(Object.assign({tap:true},o)); let done=false;
    $$('#vis .gc').forEach(c=>c.onclick=()=>{ if(done) return; done=true; const x=+c.dataset.x, y=+c.dataset.y, ok=x===target[0]&&y===target[1];
      c.classList.add(ok?'good':'bad'); if(!ok){ $(`#vis .gc[data-x="${target[0]}"][data-y="${target[1]}"]`).classList.add('good'); nope(); say(wrongMsg); } else { yay(); say('Treasure found! 💎'); }
      setTimeout(()=>next(ok), ok?800:1800); }); }
  function ask(){ markProg(i,'now'); $('#opts').innerHTML=''; $('#vis').innerHTML='';
    if(jr){ let boat=[rnd(1,3),rnd(1,3)], pos=[...boat], steps=[]; const n=i<4?2:3;
      for(let k=0;k<n;k++){ const prev=steps[steps.length-1], rev=prev?prev.split(',').map(x=>String(-x)).join(','):null; const opts=Object.keys(ARW).filter(d=>{ const [dx,dy]=d.split(',').map(Number); return d!==rev&&pos[0]+dx>=1&&pos[0]+dx<=GN&&pos[1]+dy>=1&&pos[1]+dy<=GN; }); const d=pick(opts), [dx,dy]=d.split(',').map(Number); pos=[pos[0]+dx,pos[1]+dy]; steps.push(d); }
      $('#q').innerHTML=`Move the boat: <span style="font-size:1.2em">${steps.map(d=>ARW[d]).join(' ')}</span>`; say('Move one square for each arrow, then tap where the boat ends up.');
      tapAsk({boat},pos,'Not quite. The right square is shown in green.'); }
    else { const type=pick(['tap','read','compass','tap']);
      if(type==='tap'){ const t=[rnd(1,GN),rnd(1,GN)]; $('#q').innerHTML=`Tap the square at <b>(${t[0]}, ${t[1]})</b>`; say('Go across first, then up.'); tapAsk({},t,`(${t[0]}, ${t[1]}) is ${t[0]} across and ${t[1]} up.`); }
      else if(type==='read'){ const t=[rnd(1,GN),rnd(1,GN)]; $('#q').textContent='What are the coordinates of the treasure?'; $('#vis').innerHTML=gridHTML({star:t}); say('Across first, then up.');
        choices($('#opts'),uniqOpts(`(${t[0]}, ${t[1]})`,()=>pick([`(${t[1]}, ${t[0]})`,`(${t[0]+1}, ${t[1]})`,`(${t[0]}, ${t[1]-1})`,`(${t[0]-1}, ${t[1]+1})`]),4),`(${t[0]}, ${t[1]})`,next); }
      else { const boat=[rnd(2,5),rnd(2,5)], d=pick(Object.keys(CMP)), [dx,dy]=d.split(',').map(Number); const k=rnd(1,3); const t=[boat[0]+dx*k,boat[1]+dy*k];
        if(t[0]<1||t[1]<1||t[0]>GN||t[1]>GN) return ask();
        $('#q').innerHTML=`The treasure is <b>${k}</b> square${k>1?'s':''} <b>${CMP[d]}</b> of the boat. Tap it!`; say('North is up, south is down, east is right, west is left.'); tapAsk({boat},t,`${k} ${CMP[d]} of the boat is shown in green.`); }
    } }
  ask();
}

const PITEMS=['🔴','🔵','🟡','🟢','🟣','⭐','🔺','🟧'];
function learnPatterns(){
  let mode='shape', unit=['🔴','🔵'], start=2, step=3, op='+';
  shell('Build a repeating pattern, or make a number sequence and see how it grows.',
    `<div class="tabs"><button class="btn small" data-pm="shape">🔴🔵 Repeating patterns</button><button class="btn small" data-pm="num">2, 4, 6 Number sequences</button></div><div id="pmw" style="display:flex;flex-direction:column;align-items:center;gap:16px;width:100%"></div>`);
  let bar=null;
  $$('[data-pm]').forEach(b=>b.onclick=()=>{ mode=b.dataset.pm; if(!(bar&&bar.jump(ex=>ex[0]===mode))) draw(); });
  function draw(){ $$('[data-pm]').forEach(b=>b.classList.toggle('on',b.dataset.pm===mode));
    if(mode==='shape'){
      $('#pmw').innerHTML=`<div class="qsub">Tap to add to the pattern unit (up to 4):</div><div class="tabs">${PITEMS.map(p=>`<button class="btn small" data-p="${p}">${p}</button>`).join('')}<button class="btn small" id="pclr">Clear</button></div>
        <div class="unit">${unit.map(p=>`<span>${p}</span>`).join('')||'&nbsp;'}</div><div class="patrow">${unit.length?[...Array(16)].map((_,k)=>`<span class="${k%unit.length===0?'st':''}">${unit[k%unit.length]}</span>`).join(''):''}</div>`;
      $$('#pmw [data-p]').forEach(b=>b.onclick=()=>{ if(unit.length<4){ unit.push(b.dataset.p); tone([600+unit.length*60],.05); draw(); } });
      $('#pclr').onclick=()=>{ unit=[]; draw(); };
      say(unit.length?`Your pattern repeats every <b>${unit.length}</b>. The 20th one will be ${unit[19%unit.length]}!`:'Pick some colours or shapes to build your pattern.');
    } else {
      const seq=[start]; for(let k=1;k<8;k++) seq.push(op==='+'?seq[k-1]+step:seq[k-1]*step);

function barChart(sv,counts,step=1){ const max=Math.max(...counts,4), top=Math.ceil(max/step)*step+(step>1?0:1), H=220;

  for(let v=0;v<=top;v+=step){ const y=H+20-v/top*H; s+=`<line x1="50" x2="${60+counts.length*90}" y1="${y}" y2="${y}" stroke="#d5dee6" stroke-width="1.5"/><text x="42" y="${y+5}" text-anchor="end" font-size="15" font-family="Fredoka Variable,sans-serif" fill="${INK}">${v}</text>`; }
  counts.forEach((c,k)=>{ const x=70+k*90, h=c/top*H; s+=`<rect x="${x}" y="${H+20-h}" width="60" height="${h}" rx="6" fill="${BARC[k]}" stroke="${INK}" stroke-width="3"/><text x="${x+30}" y="${H+50}" text-anchor="middle" font-size="26">${sv.items[k][1]}</text><text x="${x+30}" y="${H+72}" text-anchor="middle" font-size="14" font-family="Fredoka Variable,sans-serif" font-weight="600" fill="${INK}">${sv.items[k][0]}</text>`; });

function jugSVG(ml,max){ const h=150, lvl=Math.round(ml/max*h);

  s+=`<path d="M22 ${188-lvl} H78 V180 Q78 188 70 188 H30 Q22 188 22 180Z" fill="#f5f1e8" stroke="none"/><path d="M22 ${188-lvl} H78" stroke="#c9bfa9" stroke-width="2"/>`;
  for(let k=1;k<=10;k++){ const y=188-k*h/10; s+=`<path d="M20 ${y} h${k%5?8:14}" stroke="${INK}" stroke-width="2"/>`; if(k%5===0) s+=`<text x="40" y="${y+5}" font-size="11" font-family="Fredoka Variable,sans-serif" font-weight="700" fill="${INK}">${k*max/10}</text>`; }

const SEASONS=[['Spring','🌷'],['Summer','☀️'],['Autumn','🍂'],['Winter','❄️']];
const ord=n=>n+(n%100>=11&&n%100<=13?'th':['th','st','nd','rd'][n%10]||'th');
function calHTML(y,m,sel,opts={}){ const first=dow(y,m,1), n=dim(y,m); let cells='';
  for(let k=0;k<first;k++) cells+='<span class="cd empty"></span>';
  for(let d=1;d<=n;d++){ const td=new Date(), today=td.getFullYear()===y&&td.getMonth()===m&&td.getDate()===d; cells+=`<button class="cd ${d===sel?'sel':''} ${today?'today':''} ${dow(y,m,d)>4?'wk':''}" data-d="${d}" ${opts.tap?'':'tabindex="-1"'}>${d}</button>`; }
  return `<div class="cal"><div class="calhead">${opts.nav?'<button class="btn small" id="cprev" aria-label="Previous month">◀</button>':''}<b>${MONTHS[m]} ${y}</b>${opts.nav?'<button class="btn small" id="cnext" aria-label="Next month">▶</button>':''}</div><div class="calgrid">${DAYS.map(d=>`<span class="cdn">${d.slice(0,2)}</span>`).join('')}${cells}</div></div>`; }
function daysBetween(a,b){ return Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/864e5); }
function nextDate(m,d,from){ let t=new Date(from.getFullYear(),m,d); if(daysBetween(from,t)<0) t=new Date(from.getFullYear()+1,m,d); return t; }
function learnCalendar(){
  const now=new Date(); let y=now.getFullYear(), m=now.getMonth(), sel=now.getDate();
  shell('Move through the months and tap a day. See the day of the week, the season, and how long until special days.',
    `<div class="calwrap"><div id="cw"></div><div class="calinfo" id="ci"></div></div><div class="months" id="mo"></div>`);
  function draw(){ $('#cw').innerHTML=calHTML(y,m,sel,{nav:true,tap:true});
    $('#cprev').onclick=()=>{ m--; if(m<0){ m=11; y--; } sel=Math.min(sel,dim(y,m)); draw(); }; $('#cnext').onclick=()=>{ m++; if(m>11){ m=0; y++; } sel=Math.min(sel,dim(y,m)); draw(); };
    $$('#cw .cd[data-d]').forEach(b=>b.onclick=()=>{ sel=+b.dataset.d; tone([620],.04); draw(); });
    const dt=new Date(y,m,sel), doy=daysBetween(new Date(y,0,1),dt)+1, [sn,se]=SEASONS[seasonOf(m)];
    const ev=[['🎄 Christmas Day',11,25],['☘️ St Patrick\'s Day',2,17],['🎃 Hallowe\'en',9,31],['✝️ St Brigid\'s Day',1,1]].map(([n,mm,dd])=>{ const t=nextDate(mm,dd,dt), k=daysBetween(dt,t); return `<li>${n}: <b>${k===0?'today!':k+' day'+(k>1?'s':'')}</b></li>`; }).join('');
    $('#ci').innerHTML=`<h3>${DAYS[dow(y,m,sel)]}<br>${ord(sel)} ${MONTHS[m]} ${y}</h3><p>Day <b>${doy}</b> of ${isLeap(y)?366:365} · ${se} ${sn}</p><p>${MONTHS[m]} has <b>${dim(y,m)}</b> days${m===1?(isLeap(y)?' (a leap year!)':' (not a leap year)'):''}.</p><p style="margin-top:8px"><b>From this day:</b></p><ul>${ev}</ul>`;
    $('#mo').innerHTML=MONTHS.map((mn,k)=>`<span class="${k===m?'on':''}">${mn.slice(0,3)} <b>${dim(y,k)}</b></span>`).join('');
    say(`<b>30 days has September, April, June and November.</b> All the rest have 31, except February, which has 28, or 29 in a leap year. In Ireland, spring starts on St Brigid's Day, 1 February.`); }
  const T=new Date(); exampleBar('#stage',[[T.getFullYear(),T.getMonth(),T.getDate(),'Today'],[T.getFullYear(),11,25,'Christmas Day'],[T.getFullYear()+1,2,17,"St Patrick's Day"],[T.getFullYear()+1,1,1,"St Brigid's Day"],[2028,1,29,'A leap day'],[T.getFullYear(),9,31,"Hallowe'en"]],([yy,mm,dd])=>{ y=yy; m=mm; sel=dd; draw(); },([yy,mm,dd,l])=>`${l}: ${dd} ${MONTHS[mm]} ${yy}`);
}
function playCalendar(){
  const jr=S.level==='junior', N=jr?8:10; let i=0, score=0;
  shell(jr?'Days of the week, months and seasons.':'Read calendars, count days and spot leap years.',`<div class="q" id="q" style="font-size:clamp(22px,3.2vw,34px)"></div><div id="vis" style="display:flex;justify-content:center;width:100%"></div><div class="opts" id="opts"></div>`,`<div style="margin-top:10px">${progressDots(N)}</div>`);
  const next=ok=>{ if(ok) score++; markProg(i,ok?'ok':'no'); if(++i<N) ask(); else finish('calendar',score,N); };
  function ask(){ markProg(i,'now'); $('#vis').innerHTML='';
    if(jr){ const type=pick(['dayafter','daybefore','monthafter','season','dayafter','monthafter']);
      if(type==='dayafter'||type==='daybefore'){ const k=rnd(0,6), ans=DAYS[(k+(type==='dayafter'?1:6))%7]; $('#q').innerHTML=`What day comes <b>${type==='dayafter'?'after':'before'}</b> ${DAYS[k]}?`; say('Say the days of the week in order: Monday, Tuesday…');
        choices($('#opts'),shuffle([ans,...shuffle(DAYS.filter(d=>d!==ans&&d!==DAYS[k])).slice(0,2)]).map(x=>({label:x,value:x})),ans,next,true); }
      else if(type==='monthafter'){ const k=rnd(0,11), ans=MONTHS[(k+1)%12]; $('#q').innerHTML=`What month comes after <b>${MONTHS[k]}</b>?`; say('January, February, March…');
        choices($('#opts'),shuffle([ans,...shuffle(MONTHS.filter(x=>x!==ans&&x!==MONTHS[k])).slice(0,2)]).map(x=>({label:x,value:x})),ans,next,true); }
      else { const k=rnd(0,11), [sn,se]=SEASONS[seasonOf(k)]; $('#q').innerHTML=`What season is <b>${MONTHS[k]}</b> in?`; say('In Ireland: spring is Feb to April, summer May to July, autumn Aug to Oct, winter Nov to Jan.');
        choices($('#opts'),SEASONS.map(([n,e])=>({label:`${e} ${n}`,value:n})),sn,next,true); } }
    else { const y=new Date().getFullYear()+rnd(0,1), type=pick(['days','dow','nextweek','between','leap','dow']);
      if(type==='days'){ const k=rnd(0,11), ans=dim(y,k); $('#q').innerHTML=`How many days are in <b>${MONTHS[k]} ${y}</b>?`; say('30 days has September, April, June and November…'); choices($('#opts'),[28,29,30,31].map(x=>({label:String(x),value:x})),ans,next); }
      else if(type==='dow'){ const m=rnd(0,11), d=rnd(1,dim(y,m)); $('#q').innerHTML=`Use the calendar. What day of the week is <b>${ord(d)} ${MONTHS[m]}</b>?`; $('#vis').innerHTML=calHTML(y,m,0); const ans=DAYS[dow(y,m,d)]; say('Find the date, then look up to the top of its column.');
        choices($('#opts'),shuffle([ans,...shuffle(DAYS.filter(x=>x!==ans)).slice(0,3)]).map(x=>({label:x,value:x})),ans,next,true); }
      else if(type==='nextweek'){ const k=rnd(0,6), d=rnd(1,21), m=rnd(0,11), ans=d+7; $('#q').innerHTML=`Today is <b>${DAYS[k]} ${ord(d)} ${MONTHS[m]}</b>. What date is next ${DAYS[k]}?`; say('There are 7 days in a week.');
        choices($('#opts'),uniqOpts(ans,()=>pick([d+1,d+6,d+8,d+14]),4,x=>`${ord(x)} ${MONTHS[m]}`),ans,next,true); }
      else if(type==='between'){ const pairs=[[[11,25],[0,6],'Christmas Day','Little Christmas (6 January)'],[[2,1],[2,17],'1 March',"St Patrick's Day"],[[9,1],[9,31],'1 October',"Hallowe'en"],[[5,21],[6,4],'21 June','4 July'],[[0,1],[1,1],'New Year\'s Day',"St Brigid's Day"]];
        const [[m1,d1],[m2,d2],n1,n2]=pick(pairs), a=new Date(y,m1,d1), b=new Date(m2<m1?y+1:y,m2,d2), ans=daysBetween(a,b);
        $('#q').innerHTML=`How many days is it from <b>${n1}</b> to <b>${n2}</b>?`; say('Count on from the first date. Use the number of days in each month.');
        choices($('#opts'),uniqOpts(ans,()=>{ const w=ans+pick([-2,-1,1,2,7,-7]); return w>0?w:null; },4),ans,next); }
      else { const ys=shuffle([2024,2025,2026,2027,2028,2029,2030,2031,2032]).slice(0,4); if(!ys.some(isLeap)) ys[0]=pick([2024,2028,2032]); const ans=ys.find(isLeap), shown=[...new Set(ys)];
        if(shown.filter(isLeap).length!==1) return ask();
        $('#q').textContent='Which year is a leap year?'; say('Leap years come every 4 years. They divide exactly by 4.');
        choices($('#opts'),shuffle(shown).map(x=>({label:String(x),value:x})),ans,next); }
    } }
  ask();
}

// NUMBER DETECTIVES (odd/even, multiples, factors, primes)
// =====================================================================
const factors=n=>{ const f=[]; for(let k=1;k<=n;k++) if(n%k===0) f.push(k); return f; };
const isPrime=n=>n>1&&factors(n).length===2;
const isSquare=n=>Number.isInteger(Math.sqrt(n));
function learnDetect(){
  let mode='even', mult=3, sel=24;
  shell('Use the hundred square to find patterns. Choose a clue, then tap any number to investigate it.',
    `<div class="tabs" id="dm"><button class="btn small" data-m="even">Odd & even</button><button class="btn small" data-m="mult">Multiples</button><button class="btn small" data-m="factors">Factors</button><button class="btn small" data-m="prime">Primes</button><button class="btn small" data-m="square">Square numbers</button></div><div class="tabs" id="mk"></div><div class="hsq" id="hs"></div><div class="detinfo" id="di"></div>`);
  let bar=null;
  $$('#dm .btn').forEach(b=>b.onclick=()=>{ mode=b.dataset.m; if(!(bar&&bar.jump(ex=>ex[0]===mode))) draw(); });
  function hit(n){ return mode==='even'?(n%2===0?'ev':'od'):mode==='mult'?(n%mult===0?'on':''):mode==='factors'?(sel%n===0?'on':''):mode==='prime'?(isPrime(n)?'on':''):(isSquare(n)?'on':''); }
  function draw(){ $$('#dm .btn').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
    $('#mk').innerHTML=mode==='mult'?[2,3,4,5,6,7,8,9,10].map(k=>`<button class="btn small ${k===mult?'on':''}" data-k="${k}">${k}s</button>`).join(''):mode==='even'?'<span class="key"><i class="ev"></i> Even</span><span class="key"><i class="od"></i> Odd</span>':`<span class="key"><i class="on"></i> ${mode==='factors'?`Factors of ${sel}`:mode==='prime'?'Prime numbers':'Square numbers'}</span>`;
    $$('#mk .btn').forEach(b=>b.onclick=()=>{ mult=+b.dataset.k; if(!(bar&&bar.jump(ex=>ex[0]==='mult'&&ex[1]===mult))) draw(); });
    $('#hs').innerHTML=[...Array(100)].map((_,k)=>`<button class="hn ${hit(k+1)} ${k+1===sel?'sel':''}" data-n="${k+1}">${k+1}</button>`).join('');
    $$('#hs .hn').forEach(b=>b.onclick=()=>{ sel=+b.dataset.n; tone([400+sel*4],.04); draw(); });
    const f=factors(sel); $('#di').innerHTML=`<h3>${sel}</h3><div><span class="chip">${sel%2?'Odd':'Even'}</span>${isPrime(sel)?'<span class="chip p">Prime</span>':''}${isSquare(sel)?`<span class="chip s">Square: ${Math.sqrt(sel)} × ${Math.sqrt(sel)}</span>`:''}</div><p><b>Factors:</b> ${f.join(', ')}</p>${mode==='mult'?`<p>${sel} <b>${sel%mult===0?'is':'is not'}</b> a multiple of ${mult}${sel%mult===0?` (${sel/mult} × ${mult})`:''}.</p>`:''}`;
    say(mode==='even'?'Even numbers end in 0, 2, 4, 6 or 8. Odd numbers end in 1, 3, 5, 7 or 9.':mode==='mult'?`The multiples of <b>${mult}</b> are in its times table: ${[1,2,3,4,5].map(k=>k*mult).join(', ')}…`:mode==='factors'?`The factors of <b>${sel}</b> divide into it exactly. Tap another number to see its factors.`:mode==='prime'?'A prime number has exactly two factors: 1 and itself. 1 is not prime!':'A square number is a number times itself, like 4 × 4 = 16.'); }
  bar=exampleBar('#stage',[['even',2,24],['even',2,37],['mult',2,16],['mult',3,27],['mult',4,28],['mult',5,35],['mult',6,42],['mult',7,49],['mult',8,56],['mult',9,63],['mult',10,70],['factors',2,24],['factors',2,36],['prime',2,13],['prime',2,51],['square',2,49]],([md,mu,se])=>{ mode=md; mult=mu; sel=se; draw(); },([md,mu,se])=>md==='even'?`Is ${se} odd or even?`:md==='mult'?`Multiples of ${mu}: is ${se} one?`:md==='factors'?`Factors of ${se}`:md==='prime'?`Prime numbers: is ${se} prime?`:`Square numbers: ${se} = ${Math.sqrt(se)} × ${Math.sqrt(se)}`);
}
function playDetect(){
  const jr=S.level==='junior', N=jr?8:10; let i=0, score=0;
  shell(jr?'Odd or even? What comes next?':'Multiples, factors, primes and square numbers.',`<div class="q" id="q" style="font-size:clamp(24px,3.4vw,38px)"></div><div id="vis" style="display:flex;justify-content:center"></div><div class="opts" id="opts"></div>`,`<div style="margin-top:10px">${progressDots(N)}</div>`);
  const next=ok=>{ if(ok) score++; markProg(i,ok?'ok':'no'); if(++i<N) ask(); else finish('detect',score,N); };
  const pickWith=(test,lo,hi,n)=>{ const yes=shuffle([...Array(hi-lo+1)].map((_,k)=>k+lo).filter(test)), no=shuffle([...Array(hi-lo+1)].map((_,k)=>k+lo).filter(x=>!test(x))); return {ans:yes[0], opts:shuffle([yes[0],...no.slice(0,n-1)])}; };
  function ask(){ markProg(i,'now'); $('#vis').innerHTML='';
    if(jr){ const type=pick(['oddeven','oddeven','whicheven','count']);
      if(type==='oddeven'){ const n=rnd(1,50); $('#q').innerHTML=`Is <b>${n}</b> odd or even?`; $('#vis').innerHTML=n<=12?`<div class="emrow">${'🍪'.repeat(n)}</div>`:''; say('Look at the last digit. Can it be shared into pairs?'); choices($('#opts'),[{label:'Odd',value:'odd'},{label:'Even',value:'even'}],n%2?'odd':'even',next,true); }
      else if(type==='whicheven'){ const odd=Math.random()<.5, {ans,opts}=pickWith(x=>odd?x%2===1:x%2===0,1,30,3); $('#q').innerHTML=`Which number is <b>${odd?'odd':'even'}</b>?`; say('Even numbers end in 0, 2, 4, 6 or 8.'); choices($('#opts'),opts.map(x=>({label:String(x),value:x})),ans,next); }
      else { const st=pick([2,5,10]), a=st*rnd(1,5), seq=[a,a+st,a+2*st], ans=a+3*st; $('#q').textContent=`Count in ${st}s. What comes next?`; $('#vis').innerHTML=`<div class="seq">${seq.map(n=>`<span>${n}</span>`).join('')}<span class="qm">?</span></div>`; say(`Add ${st} each time.`);
        choices($('#opts'),uniqOpts(ans,()=>pick([ans+1,ans-1,ans+st]),3),ans,next); } }
    else { const type=pick(['mult','factor','prime','square','lcm','mult']);
      if(type==='mult'){ const k=rnd(3,9), {ans,opts}=pickWith(x=>x%k===0,10,90,4); $('#q').innerHTML=`Which is a multiple of <b>${k}</b>?`; say(`Is it in the ${k} times table?`); choices($('#opts'),opts.map(x=>({label:String(x),value:x})),ans,next); }
      else if(type==='factor'){ const n=pick([12,18,24,30,36,40,48,60,72]), {ans,opts}=pickWith(x=>n%x===0&&x>1&&x<n,2,Math.min(n-1,25),4); $('#q').innerHTML=`Which is a factor of <b>${n}</b>?`; say(`A factor divides into ${n} exactly, with no remainder.`); choices($('#opts'),opts.map(x=>({label:String(x),value:x})),ans,next); }
      else if(type==='prime'){ const {ans,opts}=pickWith(isPrime,2,60,4); $('#q').textContent='Which number is prime?'; say('A prime has only two factors: 1 and itself.'); choices($('#opts'),opts.map(x=>({label:String(x),value:x})),ans,next); }
      else if(type==='square'){ const {ans,opts}=pickWith(isSquare,2,100,4); $('#q').textContent='Which is a square number?'; say('A square number is a whole number multiplied by itself. Try each one!'); choices($('#opts'),opts.map(x=>({label:String(x),value:x})),ans,next); }
      else { const [a,b]=pick([[4,6],[3,4],[6,8],[4,10],[3,5],[6,9],[2,7]]), l=a*b/(function g(x,y){return y?g(y,x%y):x})(a,b); $('#q').innerHTML=`What is the lowest common multiple of <b>${a}</b> and <b>${b}</b>?`; say(`List the multiples of ${a} and ${b}. Which number is in both lists first?`);
        choices($('#opts'),uniqOpts(l,()=>pick([a*b,l*2,a+b,l+a]),4),l,next); }
    } }
  ask();
}

const STRATS=[
  {n:'Make 10',q:'8 + 5',s:['8 needs 2 to make 10','8 + 2 = 10','5 − 2 leaves 3','10 + 3 = 13'],a:13},
  {n:'Near doubles',q:'6 + 7',s:['6 + 6 = 12 (a double)','7 is one more than 6','12 + 1 = 13'],a:13},
  {n:'Add 9',q:'34 + 9',s:['Adding 9 is like adding 10, then taking 1 away','34 + 10 = 44','44 − 1 = 43'],a:43},
  {n:'Split into tens and ones',q:'46 + 27',s:['Tens: 40 + 20 = 60','Ones: 6 + 7 = 13','60 + 13 = 73'],a:73},
  {n:'Count on to take away',q:'52 − 48',s:['Start at 48','48 → 50 is 2','50 → 52 is 2 more','2 + 2 = 4'],a:4},
  {n:'Times 5',q:'16 × 5',s:['× 5 is half of × 10','16 × 10 = 160','Half of 160 = 80'],a:80},
  {n:'Times 4: double, double',q:'13 × 4',s:['Double 13 = 26','Double 26 = 52'],a:52},
  {n:'Divide with times tables',q:'56 ÷ 7',s:['Think: 7 × ? = 56','7 × 8 = 56','So 56 ÷ 7 = 8'],a:8},
  {n:'Times 100',q:'23 × 100',s:['Each digit moves two places to the left','23 → 2,300'],a:2300},
];
function learnSprint(){
  let st=0, shown=1;
  shell('Quick ways to work things out in your head. Press "Next step" to reveal each step.',
    `<div class="strat" id="sw"></div>`);
  function draw(){ const S_=STRATS[st];
    $('#sw').innerHTML=`<div class="sname">${S_.n}</div><div class="q">${S_.q} = ${shown>S_.s.length?`<span class="ansgood">${S_.a.toLocaleString('en-IE')}</span>`:'?'}</div><ol class="steps">${S_.s.slice(0,shown).map((x,j)=>`<li class="${j===shown-1?'pop':''}">${x}</li>`).join('')}</ol>
      <div class="tabs">${shown<=S_.s.length?`<button class="btn primary" id="stepBtn">${shown<S_.s.length?'Next step ▼':'Show answer ✓'}</button>`:''}<button class="btn small" id="stepReset">↺ Start again</button></div>`;
    const sb=$('#stepBtn'); if(sb) sb.onclick=()=>{ shown++; tone([500+shown*60],.05); draw(); };
    $('#stepReset').onclick=()=>{ shown=1; draw(); };
    say(shown>S_.s.length?`So <b>${S_.q} = ${S_.a.toLocaleString('en-IE')}</b>. Try the same trick on another one!`:`Strategy: <b>${S_.n}</b>.`); }
  exampleBar('#stage',STRATS.map((_,k)=>k),k=>{ st=k; shown=1; draw(); },k=>`${STRATS[k].n}: ${STRATS[k].q}`);
}
function playSprint(){
  const jr=S.level==='junior', N=jr?15:20, key=jr?'sprintJ':'sprintS'; let i=0, score=0, typed='', acc=0, t0=0, running=false, locked=false;
  const elapsed=()=>acc+(running?Date.now()-t0:0);
  const qs=[...Array(N)].map(()=>{ if(jr){ const t=pick(['+','+','−','d']); if(t==='+'){ const a=rnd(1,10), b=rnd(1,10); return [`${a} + ${b}`,a+b]; } if(t==='d'){ const a=rnd(1,10); return [`Double ${a}`,a*2]; } const a=rnd(5,20), b=rnd(1,a); return [`${a} − ${b}`,a-b]; }
    const t=pick(['+','−','×','÷','10','h']); if(t==='+'){ const a=rnd(12,68), b=rnd(11,99-a); return [`${a} + ${b}`,a+b]; } if(t==='−'){ const a=rnd(30,99), b=rnd(11,a-5); return [`${a} − ${b}`,a-b]; }
    if(t==='×'){ const a=rnd(2,12), b=rnd(2,12); return [`${a} × ${b}`,a*b]; } if(t==='÷'){ const b=rnd(2,12), c=rnd(2,12); return [`${b*c} ÷ ${b}`,c]; } if(t==='10'){ const a=rnd(3,99), k=pick([10,100]); return [`${a} × ${k}`,a*k]; } const a=rnd(6,50)*2; return [`Half of ${a}`,a/2]; });
  const best=S.best[key];
  shell(`${N} quick questions against the clock. Press Start to begin the clock, and Stop to pause it.`,
    `<div class="q" id="q"></div><div class="answer" id="ans">&nbsp;</div><div class="keypad" id="kp">${[7,8,9,4,5,6,1,2,3].map(d=>`<button data-d="${d}">${d}</button>`).join('')}<button data-d="del">⌫</button><button data-d="0">0</button><button data-d="ok" class="ok">✓</button></div>`,
    `<div style="margin-top:10px">${progressDots(N)}</div><div class="statline"><span>⏱️ <span id="clk">0.0</span>s</span><button class="btn small primary" id="tgo">▶ Start</button><span>${best?`🏆 ${best.toFixed(1)}s`:'🏆 No best yet'}</span></div>`);
  TIMER=setInterval(()=>{ const c=$('#clk'); if(c) c.textContent=(elapsed()/1000).toFixed(1); },100);
  function showQ(){ const fresh=i===0&&acc===0;
    if(!running){ $('#q').innerHTML=`<span style="color:var(--ink-soft)">${fresh?'Ready?':'⏸ Paused'}</span>`; say(fresh?'Press <b>▶ Start</b> when you\'re ready. The clock starts when you press it, and you can stop it any time.':'The clock is stopped. Press <b>▶ Start</b> to carry on.'); return; }
    $('#q').textContent=`${qs[i][0]} = ?`; if(i===0&&typed==='') say('Go! Type the answer, then press ✓ or Enter.'); }
  function ask(){ typed=''; locked=false; markProg(i,'now'); $('#ans').className='answer'; $('#ans').innerHTML='&nbsp;'; showQ(); }
  $('#tgo').onclick=()=>{ if(running){ acc+=Date.now()-t0; running=false; $('#tgo').textContent='▶ Start'; } else { t0=Date.now(); running=true; $('#tgo').textContent='⏸ Stop'; } tone([running?700:400],.06); showQ(); };
  function keyp(d){ if(locked) return; if(!running){ say('Press <b>▶ Start</b> first!'); return; }
    if(d==='del') typed=typed.slice(0,-1); else if(d==='ok'){ if(!typed) return; check(); return; } else if(typed.length<5) typed+=d;
    $('#ans').innerHTML=typed||'&nbsp;'; }
  function check(){ locked=true; const [q,a]=qs[i], ok=+typed===a;
    if(ok){ score++; yay(); $('#ans').classList.add('good'); } else { nope(); $('#ans').classList.add('bad','shake'); $('#ans').textContent=a; say(`${q} = <b>${a}</b>.`); }
    markProg(i,ok?'ok':'no'); setTimeout(()=>{ if(++i<N) ask(); else done(); }, ok?350:1300); }
  function done(){ document.removeEventListener('keydown',onKey); const secs=elapsed()/1000, need=Math.ceil(N*.8); let extra=`<p style="margin:2px 0">⏱️ Time: <b>${secs.toFixed(1)} seconds</b></p>`;
    if(score>=need && (!S.best[key]||secs<S.best[key])){ S.best[key]=secs; save(); extra+=`<p style="margin:2px 0">🏆 <b>New best time!</b></p>`; }
    else if(score<need) extra+=`<p style="margin:2px 0;font-size:15px;color:var(--ink-soft)">Get ${need} or more right to set a best time.</p>`;
    finish('sprint',score,N,extra); }
  $$('#kp button').forEach(b=>b.onclick=()=>keyp(b.dataset.d));
  function onKey(e){ if(!$('#kp')){ document.removeEventListener('keydown',onKey); return; } if(/^[0-9]$/.test(e.key)) keyp(e.key); else if(e.key==='Backspace') keyp('del'); else if(e.key==='Enter') keyp('ok'); }
  document.addEventListener('keydown',onKey);
  ask();
}
